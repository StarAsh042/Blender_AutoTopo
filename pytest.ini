[pytest]
# Project root = Blender_AutoTopo/ (the addon package itself).
# Pure-numpy tests run under any Python; tests that need Blender's
# ``bpy`` are auto-skipped when bpy is unavailable (see conftest.py)
# and are meant to be executed via:
#   blender --background --python test/<file>.py
minversion = 7.0
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    blender: requires Blender background mode (bpy). Auto-applied to modules that set BLENDER_TEST = True; skipped when bpy is unavailable.
    slow: long-running performance / e2e checks (auto-applied via SLOW_TEST = True).
    native: requires the precompiled QuadWild native libraries (bin/quadwild/*.dll).

# The project root *is* the Blender_AutoTopo package (it has
# __init__.py, which imports bpy). Pytest therefore cannot host a
# conftest.py at the root without executing that __init__; the bootstrap
# conftest lives in test/conftest.py instead (test/ has no __init__.py).
addopts = -ra
